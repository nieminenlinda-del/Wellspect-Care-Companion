# Deploy the Capacitor webDir (dist/client) to GitHub Pages.
# Live URL: https://nieminenlinda-del.github.io/Wellspect-Care-Companion/
#
# Enable Pages in the repo: Settings → Pages → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Pages base + bundled clinic media)
        run: npm run build
        env:
          # Project-site subdirectory. Capacitor/local builds leave VITE_BASE unset (`/`).
          VITE_BASE: /Wellspect-Care-Companion/

      - name: Verify Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          grep -q '/Wellspect-Care-Companion/' dist/client/index.html
          # Media URLs are prefixed at runtime via import.meta.env.BASE_URL and/or
          # rewritten in bundles; accept either the concatenated path or BASE_URL.
          grep -Rq 'Wellspect-Care-Companion' dist/client --include='*.js' --include='*.html'
          test -f dist/client/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
